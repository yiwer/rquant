# 日频纯动量选股器（反转的镜像对照）：每日尾盘选 N 日涨幅最大的 top-50，等权，持有 1 日。
# 反转买跌者灾难性亏损 → 检验镜像：买涨者（动量/延续）是否更好。信号作 quality，lambda=0。
quality_trees: [examples/trees/screen/momentum_xs.yaml]
setup_trees:
  动量: [examples/trees/screen/momentum_xs.yaml]
merge: { q_floor: 0.0, top: 50, lambda: 0.0, tilt_setups: ["动量"], quality_layers: 5 }
regimes:
  - { label: "2018熊", from: 2018-01-02, to: 2018-12-28 }
  - { label: "2019-21牛", from: 2019-01-02, to: 2021-12-31 }
  - { label: "2022回调", from: 2022-01-04, to: 2022-12-30 }
  - { label: "2023-25_OOS", from: 2023-01-03, to: 2026-06-12 }
