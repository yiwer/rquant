# loop fire-13 新因子：价值×净利 乘性交互(require cheap AND growing)，地板闸。vs 加性均值(冠军)。
meta: { name: mul_pb_npy, forward_window: 20, stances: [long, flat] }
params: { g_scale: 30, liq_n: 20, liq_floor: 50000000 }
root: gate
nodes:
  gate:
    type: quant
    branches:
      - { when: "fund.bps > 0 and fund.roe > 0 and fund.np_yoy > -100000 and sma(close * volume, liq_n) >= liq_floor", goto: x, label: ok }
    default: { goto: flat, label: excluded }
leaves:
  x: { stance: long, weight: "(1 / (1 + close / fund.bps)) * sigmoid(fund.np_yoy / g_scale)" }
  flat: { stance: flat }
