meta: { name: value_lt_roe, forward_window: 20, stances: [long, flat] }
params: { n: 250 }
root: gate
nodes:
  gate:
    type: quant
    branches:
      - { when: "fund.bps > 0 and fund.roe > 0 and close > sma(close, n)", goto: cheap, label: cheap_up_profitable }
    default: { goto: flat, label: flat }
leaves:
  cheap: { stance: long, weight: "1 / (1 + close/fund.bps)" }
  flat: { stance: flat }
