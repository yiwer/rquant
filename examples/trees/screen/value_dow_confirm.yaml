meta: { name: value_dow_confirm, forward_window: 20, stances: [long, flat] }
params: { n: 10, m: 20 }
root: gate
nodes:
  gate:
    type: quant
    branches:
      - { when: "fund.bps > 0 and lowest(low, n) > lowest(low, m)", goto: cheap, label: cheap_higherlow }
    default: { goto: flat, label: flat }
leaves:
  cheap: { stance: long, weight: "1 / (1 + close/fund.bps)" }
  flat: { stance: flat }
