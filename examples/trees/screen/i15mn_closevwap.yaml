# 15m-native 收盘 vs 日内VWAP：选 close/VWAP-1 最高 top-50(收盘远高于均价=日内资金净吸筹/强势)。
# 注：6mo 曾测 close_vs_vwap(≤14:45)证伪；此为多年 + 全日 VWAP 复验。滞后1日。
meta: { name: i15mn_closevwap, forward_window: 1, stances: [long, flat] }
params: { scale: 0.01 }
root: gate
nodes:
  gate:
    type: quant
    branches:
      - { when: "fund.range_pos >= 0", goto: pick, label: ok }
    default: { goto: flat, label: na }
leaves:
  pick: { stance: long, weight: "sigmoid(fund.close_vwap_gap / scale)" }
  flat: { stance: flat }
