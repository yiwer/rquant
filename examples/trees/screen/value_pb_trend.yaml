meta: { name: value_pb_trend, forward_window: 20, stances: [long, flat] }
params: { ma_n: 60 }
root: gate
nodes:
  gate:
    type: quant
    branches:
      - { when: "fund.bps > 0 and close > sma(close, ma_n)", goto: cheap, label: cheap_up }
    default: { goto: flat, label: flat }
leaves:
  cheap: { stance: long, weight: "1 / (1 + close/fund.bps)" }
  flat: { stance: flat }
