[package]
name = "rquant-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "rquant_desktop"

[dependencies]
rquant = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
