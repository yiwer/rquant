# 冻结部署副本（勿改；examples/ 同名树继续迭代不影响此处）。源 = examples/trees/screen/quality_gm_deploy.yaml
# 毛利率 gross_margin + 盈利地板(roe>0) + 流动性地板(20日均成交额≥5000万)。三核可投资版的质量 sleeve。验证见 docs/superpowers/iteration-ledger.md r26/r29。
meta: { name: quality_gm_deploy_frozen, forward_window: 20, stances: [long, flat] }
params: { gm_scale: 30, liq_n: 20, liq_floor: 50000000 }
root: gate
nodes:
  gate:
    type: quant
    branches:
      - { when: "fund.bps > 0 and fund.roe > 0 and fund.gross_margin > 0 and sma(close * volume, liq_n) >= liq_floor", goto: q, label: ok }
    default: { goto: flat, label: excluded }
leaves:
  q: { stance: long, weight: "sigmoid(fund.gross_margin / gm_scale)" }
  flat: { stance: flat }
